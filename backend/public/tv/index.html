<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wink TV</title>
<style>
  :root {
    --bg: #07080c;
    --panel: #11131b;
    --panel-2: #181b26;
    --line: #262a38;
    --text: #f4f5fa;
    --muted: #8b90a5;
    --accent: #ffd23f;
    --green: #3ddc84;
    --amber: #ffb020;
    --blue: #4da3ff;
    --red: #ff5c6c;
    --radius: 22px;
    --gap: clamp(12px, 1.2vw, 24px);
    --fs-xs: clamp(12px, 0.8vw, 16px);
    --fs-s: clamp(14px, 1vw, 20px);
    --fs-m: clamp(17px, 1.35vw, 26px);
    --fs-l: clamp(22px, 2vw, 40px);
    --fs-xl: clamp(28px, 2.7vw, 54px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 80% -10%, #1b1730 0%, transparent 60%), var(--bg);
    color: var(--text);
    font-family: Inter, "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: var(--gap);
    padding: var(--gap);
  }
  header { display: flex; align-items: center; gap: var(--gap); }
  .brand { font-weight: 900; font-size: var(--fs-xl); letter-spacing: -0.04em; display: flex; align-items: center; gap: 12px; }
  .brand .eye { width: 0.9em; height: 0.9em; border-radius: 50%; background: var(--accent); box-shadow: 0 0 24px var(--accent); animation: wink 6s infinite; }
  @keyframes wink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  .pill {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 10px 22px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line);
    font-size: var(--fs-m); font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .pill .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--muted); }
  .pill[data-state="listening"] { border-color: var(--green); color: var(--green); }
  .pill[data-state="listening"] .dot { background: var(--green); animation: pulse 1s infinite; }
  .pill[data-state="thinking"] { border-color: var(--amber); color: var(--amber); }
  .pill[data-state="thinking"] .dot { background: transparent; border: 3px solid var(--amber); border-top-color: transparent; animation: spin 0.8s linear infinite; }
  .pill[data-state="speaking"] { border-color: var(--blue); color: var(--blue); }
  .pill[data-state="speaking"] .dot { background: var(--blue); animation: pulse 0.5s infinite; }
  .pill[data-state="paused"] { border-color: var(--red); color: var(--red); }
  .pill[data-state="paused"] .dot { background: var(--red); }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spacer { flex: 1; }
  .conn { font-size: var(--fs-s); color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .conn .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
  .conn.live .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .clock { font-size: var(--fs-l); font-weight: 700; font-variant-numeric: tabular-nums; }

  main {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(260px, 1fr) minmax(0, 2.1fr) minmax(280px, 1.15fr);
    gap: var(--gap);
  }
  .panel {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(14px, 1.3vw, 26px);
    min-height: 0;
    display: flex; flex-direction: column; gap: 12px;
  }
  .label { font-size: var(--fs-xs); font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.14em; }
  .col { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }

  .transcript { font-size: var(--fs-l); font-weight: 700; line-height: 1.2; min-height: 2.4em; }
  .transcript .q { color: var(--accent); }
  .transcript.empty { color: var(--muted); font-weight: 500; }
  .history { font-size: var(--fs-s); color: var(--muted); display: flex; flex-direction: column; gap: 6px; overflow: hidden; max-height: 7.5em; }
  .pov { position: relative; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; display: none; }
  .pov.on { display: block; }
  .pov img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pov .tag { position: absolute; top: 10px; left: 10px; background: #000a; padding: 4px 10px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 800; color: var(--red); }
  .pov .box { position: absolute; border: 3px solid var(--accent); border-radius: 8px; box-shadow: 0 0 20px var(--accent); display: none; }

  .wall-head { display: flex; align-items: baseline; justify-content: space-between; }
  .count { font-size: var(--fs-s); color: var(--muted); }
  .grid {
    flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(170px, 13vw, 280px), 1fr));
    gap: var(--gap); align-content: start; padding: 6px;
  }
  .grid::-webkit-scrollbar { display: none; }
  .card {
    position: relative; border-radius: 18px; overflow: hidden; background: #000; cursor: pointer;
    border: 2px solid transparent; aspect-ratio: 4 / 3.6;
    display: flex; flex-direction: column;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, opacity 0.3s;
  }
  .card img { width: 100%; flex: 1; min-height: 0; object-fit: cover; display: block; background: #1a1d29; }
  .card .meta { padding: 10px 12px 12px; background: var(--panel-2); }
  .card .title { font-size: var(--fs-m); font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { font-size: var(--fs-xs); color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .note { position: absolute; top: 10px; left: 10px; right: 10px; background: #000b; padding: 6px 10px; border-radius: 10px; font-size: var(--fs-xs); font-weight: 700; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card:hover, .card.hover { transform: scale(1.04); border-color: var(--text); box-shadow: 0 0 0 4px #fff3, 0 20px 50px #000a; z-index: 2; }
  .card.match { border-color: var(--accent); box-shadow: 0 0 0 4px #ffd23f55, 0 0 50px #ffd23f88; }
  .card.new { animation: arrive 1.1s cubic-bezier(.2, 1.4, .4, 1); }
  .card.new::after { content: "NEW"; position: absolute; top: 10px; right: 10px; background: var(--accent); color: #000; font-weight: 900; font-size: var(--fs-xs); padding: 4px 10px; border-radius: 999px; animation: fade 6s forwards; }
  .card.leaving { animation: leave 0.6s forwards; pointer-events: none; }
  @keyframes arrive { 0% { transform: scale(0.3) rotate(-6deg); opacity: 0; box-shadow: 0 0 120px var(--accent); } 60% { opacity: 1; } 100% { transform: scale(1); box-shadow: 0 0 40px #ffd23f66; } }
  @keyframes leave { to { transform: translateY(-60px) scale(0.6) rotate(8deg); opacity: 0; } }
  @keyframes fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
  .empty-wall { color: var(--muted); font-size: var(--fs-l); font-weight: 600; text-align: center; margin: auto; line-height: 1.4; }
  .empty-wall b { color: var(--text); }

  .answer .speech { font-size: var(--fs-l); font-weight: 800; line-height: 1.22; }
  .answer .question { font-size: var(--fs-m); color: var(--accent); font-weight: 700; }
  .answer.flash { animation: glow 1.2s; }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 #ffd23f; } 100% { box-shadow: 0 0 0 30px transparent; } }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 2px solid var(--line); }
  .thumbs img:first-child { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: #ffffff14; padding: 4px 12px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 700; }
  .muted { color: var(--muted); font-size: var(--fs-m); }

  .places { display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .place { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: #ffffff0a; animation: slide 0.4s backwards; }
  .place .n { width: 1.8em; height: 1.8em; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #000; font-weight: 900; font-size: var(--fs-s); }
  .place:first-child .n { background: var(--accent); }
  .place .name { font-size: var(--fs-m); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .place .addr { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .place .dist { font-size: var(--fs-m); font-weight: 800; color: var(--blue); font-variant-numeric: tabular-nums; }
  @keyframes slide { from { transform: translateX(40px); opacity: 0; } }
  .nearby-speech { font-size: var(--fs-m); font-weight: 700; }
  .source { font-size: var(--fs-xs); color: var(--muted); }

  .toast {
    position: fixed; left: 50%; bottom: 6vh; transform: translate(-50%, 40px); opacity: 0;
    background: var(--text); color: #000; padding: 18px 34px; border-radius: 999px;
    font-size: var(--fs-l); font-weight: 900; box-shadow: 0 20px 60px #000c; z-index: 50;
    transition: all 0.3s cubic-bezier(.2, 1.4, .4, 1); pointer-events: none; white-space: nowrap;
  }
  .toast.on { transform: translate(-50%, 0); opacity: 1; }

  .cursor {
    position: fixed; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0 18%, #ffd23fcc 30%, #ffd23f33 60%, transparent 70%);
    box-shadow: 0 0 40px 10px #ffd23f66; pointer-events: none; z-index: 60; opacity: 0;
    transition: opacity 0.3s, width 0.12s, height 0.12s, margin 0.12s; will-change: transform;
  }
  .cursor.on { opacity: 1; }
  .cursor.pinch { width: 28px; height: 28px; margin: -14px 0 0 -14px; box-shadow: 0 0 60px 20px #ffd23faa; }

  .modal { position: fixed; inset: 0; background: #000c; backdrop-filter: blur(12px); display: none; place-items: center; z-index: 40; padding: 4vh 4vw; }
  .modal.on { display: grid; animation: pop 0.35s cubic-bezier(.2, 1.3, .4, 1); }
  @keyframes pop { from { opacity: 0; transform: scale(0.92); } }
  .sheet { width: min(1400px, 100%); max-height: 100%; display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 28px; padding: 28px; overflow: hidden; }
  .sheet img { width: 100%; max-height: 78vh; object-fit: contain; border-radius: 18px; background: #000; }
  .sheet .info { display: flex; flex-direction: column; gap: 16px; min-width: 0; overflow: auto; }
  .sheet h2 { margin: 0; font-size: var(--fs-xl); line-height: 1.05; letter-spacing: -0.02em; }
  .sheet .summary { font-size: var(--fs-m); line-height: 1.35; }
  .sheet .vt { font-family: ui-monospace, Menlo, monospace; font-size: var(--fs-s); background: #0008; padding: 12px; border-radius: 12px; color: #d6dae8; }
  .sheet .hint { margin-top: auto; color: var(--muted); font-size: var(--fs-s); }
  .btn { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 800; font-size: var(--fs-s); cursor: pointer; background: #ffffff1a; color: var(--text); }
  .btn.danger { background: var(--red); color: #000; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }

  .banner { position: fixed; top: 0; left: 0; right: 0; background: var(--red); color: #000; font-weight: 800; text-align: center; padding: 8px; font-size: var(--fs-s); z-index: 70; display: none; }
  .banner.on { display: block; }

  @media (max-width: 1100px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100vh; }
    main { grid-template-columns: 1fr; }
    .grid { max-height: none; overflow: visible; }
    .sheet { grid-template-columns: 1fr; overflow: auto; }
  }
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<div class="app">
  <header>
    <div class="brand"><span class="eye"></span>wink</div>
    <div class="pill" id="pill" data-state="idle"><span class="dot"></span><span id="pillText">Idle</span></div>
    <div class="spacer"></div>
    <div class="conn" id="conn"><span class="dot"></span><span id="connText">connecting</span></div>
    <div class="clock" id="clock"></div>
  </header>
  <main>
    <section class="col">
      <div class="panel">
        <div class="label">Wearer said</div>
        <div class="transcript empty" id="transcript">Say “Hey Wink, save this”</div>
        <div class="history" id="history"></div>
      </div>
      <div class="panel pov" id="pov">
        <img id="povImg" alt="Live view from the glasses">
        <span class="tag">● LIVE POV</span>
        <div class="box" id="povBox"></div>
      </div>
    </section>

    <section class="panel">
      <div class="wall-head">
        <div class="label">Memory wall</div>
        <div class="count" id="count"></div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="col">
      <div class="panel answer" id="answer">
        <div class="label" id="answerLabel">Answer</div>
        <div class="question" id="answerQ"></div>
        <div class="speech" id="answerSpeech"><span class="muted">Ask “Hey Wink, what was that book?”</span></div>
        <div class="chips" id="answerChips"></div>
        <div class="thumbs" id="answerThumbs"></div>
      </div>
      <div class="panel">
        <div class="label">Nearby · Overture Maps Places</div>
        <div class="nearby-speech" id="nearbySpeech"><span class="muted">“Where can I get this nearby?”</span></div>
        <div class="places" id="places"></div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <img id="mImg" alt="">
    <div class="info">
      <div class="label" id="mWhen"></div>
      <h2 id="mTitle"></h2>
      <div class="summary" id="mSummary"></div>
      <div class="vt" id="mText"></div>
      <div class="chips" id="mChips"></div>
      <div class="muted" id="mPlace"></div>
      <div class="row">
        <button class="btn danger" id="mDelete">Forget this</button>
        <button class="btn" id="mClose">Close</button>
      </div>
      <div class="hint">Flick to forget · pinch or palm to close</div>
    </div>
  </div>
</div>
<div class="cursor" id="cursor"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const params = new URLSearchParams(location.search);
  let token = params.get('token') || '';
  try {
    if (token) localStorage.setItem('wink.token', token);
    else token = localStorage.getItem('wink.token') || '';
  } catch (_) { /* storage blocked */ }
  const api = params.get('api') || location.origin;

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  };

  const memories = new Map(); // id -> Memory
  let order = [];             // ids, newest first
  let openId = null;
  let hoverId = null;
  let matchTimer = null;

  // ---------- helpers ----------
  function ago(iso) {
    const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    if (!isFinite(s)) return '';
    if (s < 45) return 'just now';
    const m = Math.round(s / 60);
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + ' hr ago';
    return Math.round(h / 24) + ' d ago';
  }
  function meters(d) {
    if (d === null || d === undefined) return '';
    return d < 1000 ? Math.round(d / 10) * 10 + ' m' : (d / 1000).toFixed(1) + ' km';
  }
  let toastTimer = null;
  function toast(text, ms = 2200) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), ms);
  }
  function banner(text) {
    $('banner').textContent = text || '';
    $('banner').classList.toggle('on', !!text);
  }
  function authHeaders() {
    return token ? { Authorization: 'Bearer ' + token } : {};
  }

  // ---------- clock ----------
  function tick() {
    $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.querySelectorAll('.card').forEach((card) => {
      const m = memories.get(card.dataset.id);
      if (m) card.querySelector('.when').textContent = ago(m.createdAt);
    });
  }
  setInterval(tick, 15000);
  tick();

  // ---------- status + transcript ----------
  const STATE_TEXT = { idle: 'Idle', listening: 'Listening', thinking: 'Thinking', speaking: 'Speaking', paused: 'Paused' };
  let idleTimer = null;
  function setStatus(state, text) {
    $('pill').dataset.state = state;
    $('pillText').textContent = text ? STATE_TEXT[state] + ' · ' + text : STATE_TEXT[state] || state;
    clearTimeout(idleTimer);
    if (state === 'speaking' || state === 'thinking') idleTimer = setTimeout(() => setStatus('idle'), 20000);
  }
  function setTranscript(text) {
    const t = $('transcript');
    const prev = t.classList.contains('empty') ? '' : t.textContent;
    if (prev) {
      const h = $('history');
      h.prepend(el('div', '', '“' + prev + '”'));
      while (h.children.length > 4) h.lastChild.remove();
    }
    t.classList.remove('empty');
    t.textContent = text;
  }

  // ---------- memory wall ----------
  function card(m) {
    const c = el('div', 'card');
    c.dataset.id = m.id;
    const img = el('img');
    img.src = m.imageUrl;
    img.alt = m.title;
    img.loading = 'lazy';
    c.append(img);
    if (m.note) c.append(el('div', 'note', '“' + m.note + '”'));
    const meta = el('div', 'meta');
    meta.append(el('div', 'title', m.title));
    const sub = el('div', 'sub');
    sub.append(el('span', 'when', ago(m.createdAt)));
    if (m.place) sub.append(document.createTextNode(' · ' + m.place.name));
    else if (m.objects && m.objects.length) sub.append(document.createTextNode(' · ' + m.objects.slice(0, 3).join(', ')));
    meta.append(sub);
    c.append(meta);
    c.addEventListener('click', () => openMemory(m.id));
    return c;
  }
  function renderCount() {
    $('count').textContent = order.length ? order.length + (order.length === 1 ? ' memory' : ' memories') : '';
    const grid = $('grid');
    const empty = grid.querySelector('.empty-wall');
    if (!order.length && !empty) {
      const e = el('div', 'empty-wall');
      e.innerHTML = 'No memories yet.<br>Look at something and say <b>“Hey Wink, save this.”</b>';
      grid.append(e);
    } else if (order.length && empty) empty.remove();
  }
  function renderAll() {
    const grid = $('grid');
    grid.textContent = '';
    order.forEach((id) => grid.append(card(memories.get(id))));
    renderCount();
  }
  function addMemory(m, animate) {
    const existing = $('grid').querySelector('.card[data-id="' + CSS.escape(m.id) + '"]');
    memories.set(m.id, m);
    if (existing) { existing.replaceWith(card(m)); return; }
    order.unshift(m.id);
    const c = card(m);
    if (animate) c.classList.add('new');
    $('grid').prepend(c);
    $('grid').scrollTo({ top: 0, behavior: 'smooth' });
    renderCount();
  }
  function removeMemory(id) {
    memories.delete(id);
    order = order.filter((x) => x !== id);
    const c = $('grid').querySelector('.card[data-id="' + CSS.escape(id) + '"]');
    if (c) {
      c.classList.add('leaving');
      setTimeout(() => { c.remove(); renderCount(); }, 600);
    } else renderCount();
    if (openId === id) closeMemory();
  }
  async function loadMemories() {
    try {
      const res = await fetch(api + '/v1/memories?limit=60', { headers: authHeaders() });
      if (res.status === 401) { banner('Wrong or missing token. Open /tv?token=<WINK_TOKEN>'); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const body = await res.json();
      memories.clear();
      order = [];
      (body.memories || []).forEach((m) => { memories.set(m.id, m); order.push(m.id); });
      renderAll();
      banner('');
    } catch (err) {
      banner('Could not load memories (' + err.message + ')');
      renderCount();
    }
  }
  function highlight(ids) {
    document.querySelectorAll('.card.match').forEach((c) => c.classList.remove('match'));
    ids.forEach((id) => {
      const c = $('grid').querySelector('.card[data-id="' + CSS.escape(id) + '"]');
      if (c) c.classList.add('match');
    });
    const first = ids[0] && $('grid').querySelector('.card[data-id="' + CSS.escape(ids[0]) + '"]');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    clearTimeout(matchTimer);
    matchTimer = setTimeout(() => document.querySelectorAll('.card.match').forEach((c) => c.classList.remove('match')), 15000);
  }

  // ---------- modal ----------
  function openMemory(id) {
    const m = memories.get(id);
    if (!m) return;
    openId = id;
    $('mImg').src = m.imageUrl;
    $('mImg').alt = m.title;
    $('mWhen').textContent = 'Saved ' + ago(m.createdAt) + (m.note ? ' · “' + m.note + '”' : '');
    $('mTitle').textContent = m.title;
    $('mSummary').textContent = m.summary;
    $('mText').textContent = m.visibleText || '';
    $('mText').style.display = m.visibleText ? '' : 'none';
    const chips = $('mChips');
    chips.textContent = '';
    (m.objects || []).forEach((o) => chips.append(el('span', 'chip', o)));
    $('mPlace').textContent = m.place ? m.place.name + (m.place.address ? ' · ' + m.place.address : '') : '';
    $('modal').classList.add('on');
  }
  function closeMemory() {
    openId = null;
    $('modal').classList.remove('on');
  }
  async function forget(id) {
    if (!id) return;
    const m = memories.get(id);
    toast('Forgetting ' + (m ? m.title : 'memory') + '…');
    removeMemory(id); // optimistic; the memory.deleted broadcast is idempotent
    try {
      const res = await fetch(api + '/v1/memories/' + encodeURIComponent(id), { method: 'DELETE', headers: authHeaders() });
      if (!res.ok && res.status !== 404) throw new Error('HTTP ' + res.status);
      toast('Forgotten');
    } catch (err) {
      toast('Delete failed');
      loadMemories();
    }
  }
  $('mClose').addEventListener('click', closeMemory);
  $('mDelete').addEventListener('click', () => forget(openId));
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeMemory(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMemory();
    if (e.key === 'f' && !e.metaKey && !e.ctrlKey) {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
    }
  });

  // ---------- answer / glance / nearby ----------
  function flash(id) {
    const p = $(id);
    p.classList.remove('flash');
    void p.offsetWidth;
    p.classList.add('flash');
  }
  function showAnswer(ev) {
    $('answerLabel').textContent = 'Answer';
    $('answerQ').textContent = ev.question ? '“' + ev.question + '”' : '';
    $('answerSpeech').textContent = ev.speech;
    $('answerChips').textContent = '';
    const thumbs = $('answerThumbs');
    thumbs.textContent = '';
    (ev.memories || []).forEach((m) => {
      if (!memories.has(m.id)) memories.set(m.id, m);
      const img = el('img');
      img.src = m.imageUrl;
      img.alt = m.title;
      img.title = m.title;
      img.style.cursor = 'pointer';
      img.addEventListener('click', () => openMemory(m.id));
      thumbs.append(img);
    });
    highlight((ev.memories || []).map((m) => m.id));
    flash('answer');
  }
  function showGlance(ev) {
    $('answerLabel').textContent = 'Glance';
    $('answerQ').textContent = ev.title;
    $('answerSpeech').textContent = ev.speech;
    const chips = $('answerChips');
    chips.textContent = '';
    (ev.objects || []).forEach((o) => chips.append(el('span', 'chip', o)));
    $('answerThumbs').textContent = '';
    flash('answer');
  }
  function showNearby(ev) {
    $('nearbySpeech').textContent = ev.speech;
    const list = $('places');
    list.textContent = '';
    (ev.places || []).forEach((p, i) => {
      const row = el('div', 'place');
      row.style.animationDelay = i * 90 + 'ms';
      row.append(el('div', 'n', String(i + 1)));
      const mid = el('div');
      mid.style.minWidth = '0';
      mid.append(el('div', 'name', p.name));
      mid.append(el('div', 'addr', [String(p.category || '').replace(/_/g, ' '), p.address, p.phone].filter(Boolean).join(' · ')));
      row.append(mid);
      row.append(el('div', 'dist', meters(p.distanceMeters)));
      list.append(row);
    });
  }

  // ---------- POV preview ----------
  let povTimer = null;
  function showFrame(b64) {
    $('pov').classList.add('on');
    $('povImg').src = 'data:image/jpeg;base64,' + b64;
    clearTimeout(povTimer);
    povTimer = setTimeout(() => $('pov').classList.remove('on'), 5000);
  }
  function showBox(box) {
    const b = $('povBox');
    if (!box || !$('pov').classList.contains('on')) { b.style.display = 'none'; return; }
    Object.assign(b.style, { display: 'block', left: box.x * 100 + '%', top: box.y * 100 + '%', width: box.w * 100 + '%', height: box.h * 100 + '%' });
    setTimeout(() => { b.style.display = 'none'; }, 2500);
  }

  // ---------- gestures + pointer ----------
  const GESTURE_TEXT = {
    point: '👉 Point', frame: '🖼️ Frame', lasso: '➰ Lasso', palm: '✋ Paused', thumbsUp: '👍 Got it',
    fingers: '🖐️ Fingers', pinch: '🤏 Pinch', flick: '💨 Flick',
  };
  function onGesture(ev) {
    let text = GESTURE_TEXT[ev.gesture] || ev.gesture;
    if (ev.gesture === 'fingers' && typeof ev.value === 'number') text = '🖐️ ' + ev.value;
    toast(text, 1600);
    if (ev.box) showBox(ev.box);
    if (ev.gesture === 'flick') {
      const target = openId || hoverId;
      if (target) forget(target);
    }
    if (ev.gesture === 'palm' && openId) closeMemory();
  }

  const cursor = $('cursor');
  let wasPinching = false;
  let cursorTimer = null;
  function cardAt(x, y) {
    const hit = document.elementFromPoint(x, y);
    const c = hit && hit.closest && hit.closest('.card');
    return c ? c.dataset.id : null;
  }
  function onPointer(ev) {
    const x = Math.min(1, Math.max(0, ev.x)) * innerWidth;
    const y = Math.min(1, Math.max(0, ev.y)) * innerHeight;
    cursor.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    cursor.classList.add('on');
    cursor.classList.toggle('pinch', !!ev.pinching);
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(() => {
      cursor.classList.remove('on');
      setHover(null);
    }, 1500);
    const id = openId ? null : cardAt(x, y);
    setHover(id);
    if (ev.pinching && !wasPinching) {
      if (openId) closeMemory();
      else if (id) openMemory(id);
    }
    wasPinching = !!ev.pinching;
  }
  function setHover(id) {
    if (id === hoverId) return;
    if (hoverId) {
      const old = $('grid').querySelector('.card[data-id="' + CSS.escape(hoverId) + '"]');
      if (old) old.classList.remove('hover');
    }
    hoverId = id;
    if (id) {
      const c = $('grid').querySelector('.card[data-id="' + CSS.escape(id) + '"]');
      if (c) c.classList.add('hover');
    }
  }

  // ---------- live socket ----------
  function handle(ev) {
    if (!ev || typeof ev.type !== 'string') return;
    switch (ev.type) {
      case 'status': setStatus(ev.state, ev.text); break;
      case 'transcript': setTranscript(ev.text); break;
      case 'gesture': onGesture(ev); break;
      case 'pointer': onPointer(ev); break;
      case 'frame': showFrame(ev.jpegBase64); break;
      case 'memory.saved': addMemory(ev.memory, true); toast('Saved · ' + ev.memory.title, 2600); break;
      case 'memory.deleted': removeMemory(ev.id); break;
      case 'glance': showGlance(ev); break;
      case 'answer': showAnswer(ev); break;
      case 'nearby': showNearby(ev); break;
    }
  }
  let backoff = 500;
  function connect() {
    const wsUrl = api.replace(/^http/, 'ws') + '/v1/live?role=tv' + (token ? '&token=' + encodeURIComponent(token) : '');
    let ws;
    try { ws = new WebSocket(wsUrl); } catch (_) { setTimeout(connect, backoff); return; }
    let ping = null;
    ws.onopen = () => {
      backoff = 500;
      $('conn').classList.add('live');
      $('connText').textContent = 'live';
      ping = setInterval(() => { try { ws.send('ping'); } catch (_) {} }, 25000);
      loadMemories(); // catch up on anything missed while offline
    };
    ws.onmessage = (msg) => {
      if (msg.data === 'pong') return;
      try { handle(JSON.parse(msg.data)); } catch (err) { console.warn('bad event', err); }
    };
    ws.onclose = () => {
      clearInterval(ping);
      $('conn').classList.remove('live');
      $('connText').textContent = 'reconnecting';
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 8000);
    };
    ws.onerror = () => { try { ws.close(); } catch (_) {} };
  }

  renderCount();
  connect();
  window.wink = { handle }; // debugging: wink.handle({ type: 'pointer', x: 0.5, y: 0.5, pinching: false })
})();
</script>
</body>
</html>
